[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-structure-intelligence"
version = "0.1.0"
description = "Causal, evidence-linked market observations from historical OHLCV"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "pandas>=2.2,<3", "numpy>=2,<2.4", "exchange-calendars>=4.5,<5",
  "python-multipart>=0.0.18,<1", "tzdata>=2024.1"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.knowledge" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
